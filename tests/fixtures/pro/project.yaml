# Multi-site Craft Pro: two site groups and three languages. Corporate: Corporate EN (en-US, primary) and
# Corporate DE (de-DE). Shop: Shop EN (en-US) and Shop FR (fr-FR). Primer is installed by the suite, not listed here.
# One Pages section per propagation method (pagesAll, pagesSiteGroup, pagesLanguage, pagesNone, pagesCustom), each
# enabled for every site and sharing the Page entry type, which holds an Entries, Assets and Users field per
# translation method (entriesNone, entriesSite, entriesSiteGroup, entriesLanguage, assets…, users…).
# The Entries fields relate to Library (Custom propagation, entry type Book), so a test can create the entries it
# relates to in some sites only. Images is the Solo fixture's volume (`@primerTestAssets`, see general.php).
# Generated through Craft's API; system.schemaVersion must equal Craft's own schema version.
