# Runs the code checks and both test suites on every push and pull request: the feature suite against Craft on
# SQLite, MySQL and Postgres.

name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP checks and tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]
        include:
          - db: sqlite
            database: ':memory:'
          - db: mysql
            port: 3306
            user: root
            database: primer_test
          - db: pgsql
            port: 5432
            user: postgres
            database: primer_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: primer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: primer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: ${{ matrix.database }}
      DB_USERNAME: ${{ matrix.user }}
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, intl, mbstring, openssl, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer show craftcms/cms | grep '^versions'
      - if: matrix.db == 'sqlite'
        run: composer check-cs
      - if: matrix.db == 'sqlite'
        run: composer phpstan
      - run: composer test
