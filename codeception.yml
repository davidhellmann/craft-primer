# Three suites: `unit` for pure logic without Craft, `integration` (one site) and `multisite` (four sites) against a
# real Craft install.
# The bootstrap is global because Craft's module needs its constants before any suite starts.

namespace: davidhellmann\primer\tests
support_namespace: Support
actor_suffix: Tester
bootstrap: _bootstrap.php
paths:
  tests: tests
  output: tests/_output
  data: tests/Support/Data
  support: tests/Support
  envs: tests/_envs
settings:
  colors: true
  memory_limit: 1024M
